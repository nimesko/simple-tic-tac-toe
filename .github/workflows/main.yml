name: NodeJS Build, Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js (version from .nvmrc)
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # Corepack is not bundled with Node.js 25+, its package provides the yarn command
    # and uses the version pinned in the packageManager field of package.json
    - name: Install Yarn (Corepack)
      run: npm install --global corepack
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    - name: Get the Yarn cache folder
      id: yarn-cache
      run: echo "folder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

    - name: Cache the Yarn packages
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache.outputs.folder }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - name: Install
      run: yarn install --immutable

    - name: Lint
      run: yarn lint

    - name: Check formatting
      run: yarn format:check

    - name: Accessibility scan (axe-core + contrast, fails on any violation)
      run: yarn test:a11y

    - name: Test (fails if coverage is below 95%)
      run: yarn test

    - name: Build
      run: yarn build

    - name: Upload the site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy 🚀
      id: deployment
      uses: actions/deploy-pages@v5
