name: NodeJS Build, Lint and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - uses: actions/checkout@v7

    - name: Enable Corepack (Yarn 4 from packageManager)
      run: corepack enable

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn

    - name: Install
      run: yarn install --immutable

    - name: Lint
      run: yarn lint

    - name: Check formatting
      run: yarn format:check

    - name: Accessibility scan (axe-core + contrast, fails on any violation)
      run: yarn test:a11y

    - name: Test (fails if coverage is below 95%)
      run: yarn test

    - name: Build
      run: yarn build

    - name: Deploy 🚀
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist
